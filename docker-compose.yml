services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: rote
      POSTGRES_PASSWORD: rote
      POSTGRES_DB: rote
    ports:
      # Host port 5433 to avoid clashing with a developer's local Postgres on 5432.
      # The engine connects in-network via postgres:5432, so this host mapping is host-only.
      - '5433:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U rote -d rote']
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - pgdata:/var/lib/postgresql/data

  engine:
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      SERVICE_MODE: all
      PORT: 8080
      DATABASE_URL: postgres://rote:rote@postgres:5432/rote
      STORAGE_BACKEND: local
      STORAGE_LOCAL_PATH: /data
      CACHE_BACKEND: local
      MAX_CONCURRENT_RUNS: 3
      MAX_QUEUE_DEPTH: 20
      RUN_TIMEOUT_SECONDS: 180
      MAX_RUN_TIMEOUT_SECONDS: 600
      BROWSER_RECYCLE_RUNS: 10
      REPLAY_LLM_FALLBACK: 'off'
      API_AUTH_MODE: none
      # Model provider for agent mode — interpolated from the host env / .env (key stays out of the
      # image; .env is .dockerignored). Empty when unset, so replay-only runs are unaffected.
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      ANTHROPIC_BASE_URL: ${ANTHROPIC_BASE_URL:-}
      # Permit the in-network fixture (http://fixture:3100) as an agent target for the cold-start gate.
      ALLOW_PRIVATE_TARGETS: 'true'
      # Stagehand launches its own Chromium and needs the binary path (the base image ships it; auto-
      # detection isn't enough in-container). Path is tied to the pinned playwright:v1.61.0-noble image.
      CHROME_PATH: /ms-playwright/chromium-1228/chrome-linux/chrome
      CHROMIUM_EXECUTABLE_PATH: /ms-playwright/chromium-1228/chrome-linux/chrome
    ports:
      - '8080:8080'
    volumes:
      - ./data:/data

  # Offline fixture site for the cold-start gate; the engine reaches it at http://fixture:3100.
  fixture:
    build: .
    command: ['npx', 'tsx', 'test/fixtures/site/server.ts']
    environment:
      FIXTURE_PORT: '3100'

  # AWS emulator (SQS + S3) for the Phase 6 cloud topology + integration tests (DECISIONS #29).
  # The init hook creates the bucket + queues. Reachable in-network at http://localstack:4566.
  localstack:
    image: localstack/localstack:3
    environment:
      SERVICES: s3,sqs
      DEBUG: '0'
    ports:
      - '4566:4566'
    volumes:
      - ./scripts/localstack-init.sh:/etc/localstack/init/ready.d/init.sh
    healthcheck:
      test: ['CMD-SHELL', 'awslocal sqs get-queue-url --queue-name rote-runs || exit 1']
      interval: 3s
      timeout: 5s
      retries: 30

volumes:
  pgdata:
